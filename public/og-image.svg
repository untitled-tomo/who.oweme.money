  </text>
  
  <!-- Icon representations -->
  <g transform="translate(350, 300)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#4DB6AC" />
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">Food</text>
  </g>
  
  <g transform="translate(550, 300)">
